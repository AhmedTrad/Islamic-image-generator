<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islamic Palette Template Studio</title>

    <!-- ── Tailwind CSS (Play CDN — requires internet) ── -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ── Arabic / Calligraphy fonts (requires internet) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet" />

    <!-- ── Local libraries ── -->
    <script src="assets/lib/react.development.js"></script>
    <script src="assets/lib/react-dom.development.js"></script>
    <script src="assets/lib/babel.min.js"></script>

    <!-- ── App constants & utilities (plain JS, loaded before Babel transforms) ── -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>

    <!-- ── Custom styles ── -->
    <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
    <div id="root"></div>

    <!-- ── React application (JSX — transformed in-browser by Babel) ── -->
    <script type="text/babel" data-presets="react" src="assets/js/app.js"></script>
</body>

</html>
